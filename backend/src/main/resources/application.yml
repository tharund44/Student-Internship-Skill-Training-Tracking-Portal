spring:
  application:
    name: backend
  datasource:
    url: jdbc:h2:file:./data/interntrack
    username: sa
    password: password
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

app:
  jwt:
    secret: 94a08da1fecbb6e8b46990538c7b50b2a75d1f8f94a08da1fecbb6e8b46990538c7b50b2a75d1f8f
    expiration: 86400000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
